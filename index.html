<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#147d83" />
    <title>Sethu's Buddy Care</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="top-bar">
        <button class="icon-button" id="speakPromptButton" type="button" aria-label="Repeat prompt">
          <i data-lucide="volume-2" aria-hidden="true"></i>
        </button>
        <div class="title-block">
          <p class="kicker">Hello, Sethu</p>
          <h1>Sethu's Buddy Care</h1>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Open grown-up settings">
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </header>

      <section class="progress-strip" aria-label="Progress">
        <div>
          <span class="metric-label">Stars</span>
          <strong id="starCount">0</strong>
        </div>
        <div>
          <span class="metric-label">Today</span>
          <strong id="streakCount">0</strong>
        </div>
        <div>
          <span class="metric-label">Mode</span>
          <strong id="modeLabel">Care</strong>
        </div>
      </section>

      <section class="progress-panel" id="progressPanel" aria-label="Progress towards next reward">
        <i data-lucide="star" aria-hidden="true"></i>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-count" id="progressCount">0 / 10</span>
      </section>

      <section class="scene" aria-label="Game scene">
        <div class="room" id="room">
          <div class="wall-art flower-art" aria-hidden="true"></div>
          <div class="window" aria-hidden="true">
            <span></span>
          </div>

          <!-- Scene extras per mode -->
          <div class="scene-extra scene-extra-care" aria-hidden="true"></div>
          <div class="scene-extra scene-extra-dress" aria-hidden="true"></div>
          <div class="scene-extra scene-extra-animals" aria-hidden="true"></div>
          <div class="scene-extra scene-extra-story" aria-hidden="true"></div>
          <div class="scene-extra scene-extra-music" aria-hidden="true"></div>
          <div class="scene-extra scene-extra-color" aria-hidden="true"></div>

          <div class="buddy-wrap">
            <div class="speech-bubble" id="buddyBubble">Can you say: I want food?</div>
            <div class="buddy" aria-label="Friendly girl character">
              <img class="buddy-art" src="assets/buddy.png" alt="Your smiling buddy with curly hair and a coral dress" />
              <img class="buddy-art dress-layer" id="buddyDress" src="assets/buddy.png" alt="" aria-hidden="true" />
              <img class="buddy-art shoes-layer" id="buddyShoes" src="assets/buddy.png" alt="" aria-hidden="true" />
              <div class="hat" id="buddyHat" aria-hidden="true">👒</div>
            </div>
          </div>
          <div class="scene-response" id="sceneResponse" aria-live="polite"></div>
          <div class="reward-shelf" id="rewardShelf" aria-label="Collected stickers"></div>
        </div>
      </section>

      <section class="prompt-panel" aria-label="Current speaking task">
        <div class="prompt-card">
          <div class="prompt-picture" id="promptPicture" aria-hidden="true">🍎</div>
          <div>
            <p class="prompt-helper">Say this with me</p>
            <h2 id="targetPhrase">I want food</h2>
            <p id="promptHint">Use a short request to help your buddy eat.</p>
          </div>
        </div>
        <div class="heard-line" id="heardLine">Tap the microphone when Sethu is ready.</div>
        <div class="action-row">
          <button class="primary-action" id="listenButton" type="button">
            <i data-lucide="mic" aria-hidden="true"></i>
            <span id="listenLabel">Speak</span>
          </button>
          <button class="secondary-action" id="tapHelpButton" type="button"><i data-lucide="hand" aria-hidden="true"></i>Help</button>
          <button class="next-action" id="nextButton" type="button" hidden>Next<i data-lucide="arrow-right" aria-hidden="true"></i></button>
        </div>
      </section>

      <nav class="mode-tabs" aria-label="Game modes">
        <button class="mode-tab active" type="button" data-mode="care"><i data-lucide="heart"></i>Care</button>
        <button class="mode-tab" type="button" data-mode="dress"><i data-lucide="shirt"></i>Dress</button>
        <button class="mode-tab" type="button" data-mode="animals"><i data-lucide="paw-print"></i>Animals</button>
        <button class="mode-tab" type="button" data-mode="story"><i data-lucide="book-open"></i>Story</button>
        <button class="mode-tab" type="button" data-mode="music"><i data-lucide="music-2"></i>Music</button>
        <button class="mode-tab" type="button" data-mode="color"><i data-lucide="palette"></i>Color</button>
      </nav>
    </main>

    <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
      <div class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-head">
          <h2 id="settingsTitle">Grown-up settings</h2>
          <button class="icon-button" id="closeSettingsButton" type="button" aria-label="Close settings"><i data-lucide="x"></i></button>
        </div>
        <label class="setting-row">
          <span>Speech match</span>
          <select id="strictnessSelect">
            <option value="gentle">Gentle: key words count</option>
            <option value="phrase">Phrase: most words count</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Voice speed</span>
          <input id="voiceRate" type="range" min="0.65" max="1" step="0.05" value="0.82" />
        </label>
        <label class="toggle-row">
          <input id="tapBackupToggle" type="checkbox" checked />
          <span>Allow tap help when speaking is hard</span>
        </label>
        <label class="toggle-row"><input id="quietToggle" type="checkbox" /><span>Quiet sounds and gentle motion</span></label>
      </div>
    </aside>

    <script src="assets/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
